<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Zenrixa</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://js.stripe.com/v3/"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #000;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 48px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.brand-icon { width: 32px; height: 32px; border-radius: 8px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 6px; }
.brand-icon svg { width: 100%; height: 100%; color: #0b0b0c; }
.brand-name { font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
.header-right { display: flex; align-items: center; gap: 16px; }
.email-display { font-size: 13px; color: #a1a1aa; }
.btn {
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: background 0.2s;
}
.btn-logout { border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #fff; }
.btn-logout:hover { background: rgba(255,255,255,0.1); }
.btn-back {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.08); color: #fff; cursor: pointer; display: flex;
  align-items: center; justify-content: center; transition: all 0.2s;
  font-size: 20px; line-height: 1; padding: 0;
}
.btn-back:hover { background: rgba(255,255,255,0.2); border-color: #fff; }

.container { max-width: 640px; margin: 0 auto; padding: 48px 24px; flex: 1; width: 100%; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
.sub { color: #a1a1aa; font-size: 14px; margin-bottom: 32px; }
.plan-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 28px;
  margin-bottom: 24px;
}
.plan-name { font-size: 12px; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-bottom: 8px; }
.plan-price { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
.plan-price span { font-size: 16px; font-weight: 400; color: #a1a1aa; margin-left: 4px; }
.plan-desc { color: #a1a1aa; font-size: 14px; margin-top: 8px; line-height: 1.6; }
.divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 20px 0; }
.features { list-style: none; display: flex; flex-direction: column; gap: 12px; }
.features li { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #d4d4d8; }
.features li svg { width: 16px; height: 16px; color: #22d3ee; flex-shrink: 0; }

.alert { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
.alert.error { display: block; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }

/* ---- Payment card (Stripe Checkout inspired) ---- */
.payment-card {
  background: #ffffff;
  color: #0f172a;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.25);
}
.payment-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.payment-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.payment-icons { display: flex; align-items: center; gap: 6px; opacity: 0.8; }

.field { margin-bottom: 20px; }
.field-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 6px;
}

.input {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 15px;
  font-family: inherit;
  color: #0f172a;
  background: #fff;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.input::placeholder { color: #9ca3af; }
.input:focus { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb; }
.input-error { border-color: #ef4444; }
.input-error:focus { border-color: #ef4444; box-shadow: 0 0 0 1px #ef4444; }

.card-field {
  position: relative;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  background: #fff;
  padding: 11px 14px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.card-field:focus-within { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb; }
.card-field-error { border-color: #ef4444; }
.card-field-error:focus-within { border-color: #ef4444; box-shadow: 0 0 0 1px #ef4444; }
.card-logo {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  pointer-events: none;
  transition: opacity 0.15s;
}
.card-field:focus-within .card-logo { opacity: 0; }

.select-wrap { position: relative; }
.select-wrap select {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 36px;
  cursor: pointer;
  background: #fff;
}
.select-arrow {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  display: flex;
  color: #6b7280;
}

.save-check {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
  color: #374151;
  margin: 22px 0;
  cursor: pointer;
  user-select: none;
}
.save-check input {
  width: 16px;
  height: 16px;
  margin-top: 1px;
  accent-color: #2563eb;
  cursor: pointer;
  flex-shrink: 0;
}

.pay-btn {
  width: 100%;
  padding: 14px 24px;
  border-radius: 6px;
  background: #2563eb;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: background 0.15s, opacity 0.15s;
  box-shadow: 0 4px 14px rgba(37,99,235,0.3);
}
.pay-btn:hover { background: #1d4ed8; }
.pay-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.pay-btn svg { width: 18px; height: 18px; }
.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
.pay-btn.loading .spinner { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

.security { display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: 24px; color: #52525b; font-size: 12px; }
.security svg { width: 16px; height: 16px; color: #71717a; }
.loading { text-align: center; padding: 48px; color: #737373; }

.history-card {
  margin-top: 32px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 28px;
}
.history-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.history-title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.history-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}
.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
}
.history-item-left { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.history-plan { font-size: 15px; font-weight: 600; }
.history-meta { font-size: 12px; color: #737373; }
.history-right { text-align: right; flex-shrink: 0; }
.history-amount { font-size: 16px; font-weight: 700; }
.history-empty { text-align: center; padding: 32px; color: #737373; font-size: 14px; }
.history-back-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 24px;
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
.history-back-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }
.history-back-btn svg { width: 16px; height: 16px; }
</style>
</head>

<script>
const planData = {
  basic: { name: 'Basic', on_6_months: 20, forever: 80, desc: 'For creators taking their first steps with Forma.' },
  standard: { name: 'Standard', on_6_months: 40, forever: 160, desc: 'For freelancers and small teams who need more freedom.' },
  pro: { name: 'Pro', on_6_months: 100, forever: 400, desc: 'For studios, agencies, and professional creators.' }
};

let stripe, cardElement, _clientSecret, _mode;

const cardStyle = {
  base: {
    fontSize: '15px',
    color: '#0f172a',
    fontFamily: "'DM Sans', sans-serif",
    '::placeholder': { color: '#9ca3af' },
    iconColor: '#94a3b8',
  },
  invalid: { color: '#ef4444', iconColor: '#ef4444' }
};

async function loadCheckout() {
  const user = await getCurrentUser();
  if (!user) {
    const qs = new URLSearchParams(window.location.search).toString();
    window.location.href = 'login.html' + (qs ? '?' + qs : '');
    return;
  }
  document.getElementById('user-email').textContent = user.email;

  const params = new URLSearchParams(window.location.search);
  const planId = params.get('plan');
  const billing = normalizeBillingCycle(params.get('billing'));
  const plan = planId && planData[planId];

  document.getElementById('loading').style.display = 'none';
  document.getElementById('checkout-content').style.display = 'block';

  if (!plan) {
    window._checkout = null;
    setError('Please select a plan to continue.');
    document.getElementById('plan-card').innerHTML = '<div class="plan-desc">No plan selected.</div>';
    document.getElementById('pay-btn').disabled = true;
    return;
  }

  const price = billing === 'forever' ? plan.forever : plan.on_6_months;

  const features = {
    basic: ['3 projects', '1080p export', 'Basic editing tools', 'Free templates', 'Web & mobile access'],
    standard: ['50 projects', '4K export', 'Advanced toolkit', '5 team members', 'Premium templates'],
    pro: ['Unlimited projects', '8K + animations', 'AI-powered tools', 'Unlimited team', 'Brand customization']
  };

  document.getElementById('plan-card').innerHTML = `
    <div class="plan-name">${plan.name}</div>
    <div class="plan-price">$${price}<span>${billing === 'forever' ? 'one-time' : 'every 6 months'}</span></div>
    <div class="plan-desc">${plan.desc}</div>
    <hr class="divider" />
    <ul class="features">
      ${features[planId].map(f => `<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>${f}</li>`).join('')}
    </ul>
  `;

  window._checkout = { planId, billing, price };
  initPayment().catch((err) => {
    setError(err.message);
  });
}

async function initPayment() {
  stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
  const intent = await createPaymentIntent(window._checkout.planId, window._checkout.billing);
  if (!intent || typeof intent.clientSecret !== 'string' || !intent.clientSecret.includes('_secret_')) {
    throw new Error('create-payment-intent did not return a valid clientSecret');
  }
  _clientSecret = intent.clientSecret;
  _mode = intent.mode;
  const elements = stripe.elements();
  cardElement = elements.create('card', { style: cardStyle });
  cardElement.mount('#card-number');
  cardElement.on('change', (event) => {
    if (event.error) {
      setError(event.error.message);
    } else {
      clearError();
    }
  });
}

function setError(message) {
  const el = document.getElementById('alert');
  el.className = 'alert error';
  el.textContent = message;
}

function clearError() {
  const el = document.getElementById('alert');
  el.className = 'alert';
  el.textContent = '';
}

function setLoading(loading) {
  const btn = document.getElementById('pay-btn');
  btn.disabled = loading;
  btn.classList.toggle('loading', loading);
  document.getElementById('pay-label').textContent = loading ? 'Processing…' : 'Pay';
}

async function handlePayment() {
  if (!window._checkout || !window._checkout.planId) {
    setError('Please select a plan to continue.');
    return;
  }
  const nameEl = document.getElementById('card-name');
  const countryEl = document.getElementById('country');
  const name = nameEl.value.trim();
  const country = countryEl.value;

  if (!name) { setError('Please enter the full name on the card.'); nameEl.focus(); return; }
  if (!country) { setError('Please select your country or region.'); countryEl.focus(); return; }

  const save = document.getElementById('save-info').checked;
  setLoading(true);

  try {
    if (_mode === 'payment') {
      const { error } = await stripe.confirmCardPayment(_clientSecret, {
        payment_method: {
          card: cardElement,
          billing_details: { name, address: { country } }
        },
        save_payment_method: save,
      });
      if (error) throw error;
    } else {
      const { setupIntent, error } = await stripe.confirmCardSetup(_clientSecret, {
        payment_method: {
          card: cardElement,
          billing_details: { name, address: { country } }
        }
      });
      if (error) throw error;
      await createSubscription(window._checkout.planId, window._checkout.billing, setupIntent.payment_method);
    }
    window.location.href = 'account.html';
  } catch (err) {
    setError(err.message);
    setLoading(false);
  }
}

async function loadPurchaseHistory() {
  const user = await getCurrentUser();
  if (!user) return;
  const list = document.getElementById('history-list');
  const loading = document.getElementById('history-loading');
  try {
    const purchases = await getUserPurchases(user.id);
    loading.style.display = 'none';
    if (!purchases || purchases.length === 0) {
      list.innerHTML = '<div class="history-empty">No purchases yet. Your bought plans will appear here.</div>';
      return;
    }
    list.innerHTML = purchases.map(p => {
      const cycleLabel = { on_6_months: 'Every 6 months', forever: 'One-time' }[p.billing_cycle] || p.billing_cycle || 'One-time';
      const date = new Date(p.created_at).toLocaleDateString('en-US', {
        year: 'numeric', month: 'long', day: 'numeric'
      });
      const status = p.status || 'pending';
      return `<div class="history-item">
        <div class="history-item-left">
          <span class="history-plan">${p.plan_name}</span>
          <span class="history-meta">${cycleLabel} &middot; ${date}</span>
        </div>
        <div class="history-right">
          <div class="history-amount">$${p.amount}</div>
          <div class="purchase-status" style="font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin-top:4px;color:${status === 'active' ? '#22d3ee' : status === 'pending' ? '#f59e0b' : '#ef4444'};">${status}</div>
        </div>
      </div>`;
    }).join('');
  } catch (err) {
    loading.style.display = 'none';
    list.innerHTML = `<div class="history-empty">Failed to load purchase history: ${err.message}</div>`;
  }
}

function returnToDashboard() {
  window.location.href = 'account.html';
}

loadCheckout();
loadPurchaseHistory();
</script>
</body>
</html>
