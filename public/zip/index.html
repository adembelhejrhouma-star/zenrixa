<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Animation-Zenrixa</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: #000;
  overflow-x: hidden;
}
#wrapper {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
}
canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}
#spacer {
  position: relative;
  pointer-events: none;
  z-index: 0;
}
</style>
</head>
<body>

<div id="wrapper">
  <canvas id="c"></canvas>
</div>
<div id="spacer"></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const spacer = document.getElementById('spacer');

const frameFiles = [
  "ezgif-frame-001.webp","ezgif-frame-002.webp","ezgif-frame-003.webp","ezgif-frame-004.webp","ezgif-frame-005.webp","ezgif-frame-006.webp","ezgif-frame-007.webp","ezgif-frame-008.webp","ezgif-frame-009.webp","ezgif-frame-010.webp",
  "ezgif-frame-011.webp","ezgif-frame-023.webp","ezgif-frame-024.webp","ezgif-frame-025.webp","ezgif-frame-026.webp","ezgif-frame-027.webp","ezgif-frame-028.webp","ezgif-frame-029.webp","ezgif-frame-030.webp","ezgif-frame-031.webp",
  "ezgif-frame-032.webp","ezgif-frame-033.webp","ezgif-frame-056.webp","ezgif-frame-057.webp","ezgif-frame-058.webp","ezgif-frame-059.webp","ezgif-frame-060.webp","ezgif-frame-061.webp","ezgif-frame-062.webp","ezgif-frame-063.webp",
  "ezgif-frame-064.webp","ezgif-frame-065.webp","ezgif-frame-066.webp","ezgif-frame-067.webp","ezgif-frame-068.webp","ezgif-frame-069.webp","ezgif-frame-070.webp","ezgif-frame-071.webp","ezgif-frame-072.webp","ezgif-frame-073.webp",
  "ezgif-frame-074.webp","ezgif-frame-075.webp","ezgif-frame-076.webp","ezgif-frame-077.webp","ezgif-frame-078.webp","ezgif-frame-079.webp","ezgif-frame-080.webp","ezgif-frame-081.webp","ezgif-frame-082.webp","ezgif-frame-083.webp",
  "ezgif-frame-084.webp","ezgif-frame-085.webp","ezgif-frame-086.webp","ezgif-frame-087.webp","ezgif-frame-088.webp","ezgif-frame-089.webp","ezgif-frame-090.webp","ezgif-frame-091.webp","ezgif-frame-092.webp","ezgif-frame-093.webp",
  "ezgif-frame-094.webp","ezgif-frame-095.webp","ezgif-frame-096.webp","ezgif-frame-097.webp","ezgif-frame-098.webp","ezgif-frame-099.webp","ezgif-frame-100.webp","ezgif-frame-101.webp","ezgif-frame-102.webp","ezgif-frame-103.webp",
  "ezgif-frame-104.webp","ezgif-frame-105.webp","ezgif-frame-106.webp","ezgif-frame-107.webp","ezgif-frame-108.webp","ezgif-frame-109.webp","ezgif-frame-110.webp","ezgif-frame-111.webp","ezgif-frame-112.webp","ezgif-frame-113.webp",
  "ezgif-frame-114.webp","ezgif-frame-115.webp","ezgif-frame-116.webp","ezgif-frame-117.webp","ezgif-frame-118.webp","ezgif-frame-119.webp","ezgif-frame-120.webp"
];

const totalFrames = frameFiles.length;
const images = [];
let loaded = 0;
let ready = false;

function preload() {
  for (let i = 0; i < totalFrames; i++) {
    const img = new Image();
    img.src = frameFiles[i];
    img.onload = () => {
      loaded++;
      if (loaded === 1) {
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        spacer.style.height = '500vh';
        window.addEventListener('scroll', onScroll);
        updateFrame();
        document.documentElement.style.scrollBehavior = 'smooth';
      }
      if (loaded === totalFrames) {
        ready = true;
        updateFrame();
      }
    };
    img.onerror = () => {
      loaded++;
      if (loaded === totalFrames) {
        ready = true;
        updateFrame();
      }
    };
    images.push(img);
  }
}

function render(idx) {
  if (!ready) return;
  const clamped = Math.max(0, Math.min(Math.round(idx), totalFrames - 1));
  const img = images[clamped];
  if (!img || !img.complete) return;

  const cw = canvas.width;
  const ch = canvas.height;
  const ratio = 16 / 9;

  let dw, dh, dx, dy;
  if (cw / ch > ratio) {
    dh = ch;
    dw = ch * ratio;
    dx = (cw - dw) / 2;
    dy = 0;
  } else {
    dw = cw;
    dh = cw / ratio;
    dx = 0;
    dy = (ch - dh) / 2;
  }

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cw, ch);
  ctx.drawImage(img, dx, dy, dw, dh);
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  updateFrame();
}

let lastFrame = -1;
const scrollHeight = 500;

function onScroll() {
  if (!ready) return;
  const scrollTop = window.scrollY;
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  const progress = maxScroll > 0 ? scrollTop / maxScroll : 0;
  const frameIdx = Math.round(progress * (totalFrames - 1));
  if (frameIdx !== lastFrame) {
    lastFrame = frameIdx;
    render(frameIdx);
  }
}

function updateFrame() {
  onScroll();
}

preload();
</script>
</body>
</html>
