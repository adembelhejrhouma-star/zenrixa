const totalFrames = frameFiles.length;
const images = [];
let loaded = 0;
let ready = false;
let currentFrame = 0;

function preload() {
  for (let i = 0; i < totalFrames; i++) {
    const img = new Image();
    img.src = frameFiles[i];
    img.onload = () => {
      loaded++;
      if (loaded === 1) {
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
      }
      if (loaded === totalFrames) {
        ready = true;
        render(0);
      }
    };
    img.onerror = () => {
      loaded++;
      if (loaded === totalFrames) {
        ready = true;
        render(0);
      }
    };
    images.push(img);
  }
}

function render(idx) {
  if (!ready) return;
  const clamped = Math.max(0, Math.min(Math.round(idx), totalFrames - 1));
  const img = images[clamped];
  if (!img || !img.complete) return;

  const cw = canvas.width;
  const ch = canvas.height;
  const ratio = 16 / 9;

  let dw, dh, dx, dy;
  if (cw / ch > ratio) {
    dh = ch;
    dw = ch * ratio;
    dx = (cw - dw) / 2;
    dy = 0;
  } else {
    dw = cw;
    dh = cw / ratio;
    dx = 0;
    dy = (ch - dh) / 2;
  }

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cw, ch);
  ctx.drawImage(img, dx, dy, dw, dh);
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (ready) render(currentFrame);
}

let lastTime = 0;
const FRAME_INTERVAL = 1000 / 24;

function animate(time) {
  if (!ready) {
    requestAnimationFrame(animate);
    return;
  }

  const delta = time - lastTime;
  if (delta >= FRAME_INTERVAL) {
    lastTime = time - (delta % FRAME_INTERVAL);
    currentFrame += 1;
    if (currentFrame >= totalFrames) {
      currentFrame = 0;
    }
    render(currentFrame);
  }

  requestAnimationFrame(animate);
}

preload();
requestAnimationFrame(animate);
